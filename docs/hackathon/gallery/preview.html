<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>kakeratta — Gallery</title><style>body{font:18px/1.5 system-ui;background:#f5f3ed;color:#24372e;max-width:1200px;margin:auto;padding:32px}img{width:100%;height:auto;border-radius:12px}figure{margin:32px 0 60px}h1{font-size:32px}figcaption{margin-top:16px;color:#55634d}nav{display:flex;gap:12px;flex-wrap:wrap}nav a{color:inherit}</style><h1>kakeratta — Your life, remembered.</h1><p>15 English images · 3600 × 2400 · upload in numbered order</p><nav><a href="#slide-1">1. CAPTURE</a><a href="#slide-2">2. PERSONALIZE</a><a href="#slide-3">3. REMEMBER</a><a href="#slide-4">4. CONTROL</a><a href="#slide-5">5. RECONNECT</a><a href="#slide-6">6. PREPARE</a><a href="#slide-7">7. CONNECT</a><a href="#slide-8">8. FOLLOW THROUGH</a><a href="#slide-9">9. GROW</a><a href="#slide-10">10. LOOK BACK</a><a href="#slide-11">11. REFINE</a><a href="#slide-12">12. EXTEND</a><a href="#slide-13">13. SPEAK</a><a href="#slide-14">14. EXPRESS</a><a href="#slide-15">15. UNDER THE HOOD</a></nav><figure id="slide-1"><a href="images/01-a-life-in-fragments.png"><img loading="lazy" src="images/01-a-life-in-fragments.png" alt="Small fragments. A memory that helps you live."></a><figcaption><strong>1. Small fragments. A memory that helps you live.</strong><br>Post text, photos, URLs or speech. Dedicated personas keep personal context and can bring it back when it matters.</figcaption></figure><figure id="slide-2"><a href="images/02-people-and-interests.png"><img loading="lazy" src="images/02-people-and-interests.png" alt="Your people and interests, with their own context."></a><figcaption><strong>2. Your people and interests, with their own context.</strong><br>Create a persona in plain language for an interest or a person. Each can have its own instructions and optional memory; people also have basic information and important dates.</figcaption></figure><figure id="slide-3"><a href="images/03-fragments-become-facts.png"><img loading="lazy" src="images/03-fragments-become-facts.png" alt="Separate wine notes become a grounded preference."></a><figcaption><strong>3. Separate wine notes become a grounded preference.</strong><br>A conversation appends a fragment record. At check-in, memory tidying folds related records into facts with source links. This before/after example shows wine preferences; it is not an immediate conversion after a post.</figcaption></figure><figure id="slide-4"><a href="images/04-you-decide-what-stays.png"><img loading="lazy" src="images/04-you-decide-what-stays.png" alt="Inspect the memory. Correct it. Decide what stays."></a><figcaption><strong>4. Inspect the memory. Correct it. Decide what stays.</strong><br>Trace a fact to its original post, correct or forget it. A check-in can also ask whether an old record still matters, with choices to forget it, keep it longer or retain it. Forgetting a memory preserves the original timeline post.</figcaption></figure><figure id="slide-5"><a href="images/05-remember-at-the-right-time.png"><img loading="lazy" src="images/05-remember-at-the-right-time.png" alt="A forgotten restaurant comes back before the next trip."></a><figcaption><strong>5. A forgotten restaurant comes back before the next trip.</strong><br>A missed restaurant visit and a later trip can connect at a persona check-in. The persona can bring back the earlier plan even when the new post never names the restaurant.</figcaption></figure><figure id="slide-6"><a href="images/06-ready-before-you-leave.png"><img loading="lazy" src="images/06-ready-before-you-leave.png" alt="Your plans, past omissions and fresh weather, together."></a><figcaption><strong>6. Your plans, past omissions and fresh weather, together.</strong><br>With a known departure time, sona can schedule a preparation check, combine grounded belongings and past omissions with a fresh weather forecast, and post before departure. This curated UI example does not represent a live forecast or departure detection.</figcaption></figure><figure id="slide-7"><a href="images/07-review-mail-and-calendar.png"><img loading="lazy" src="images/07-review-mail-and-calendar.png" alt="Mail and Calendar cards wait for your decision."></a><figcaption><strong>7. Mail and Calendar cards wait for your decision.</strong><br>The separate personal Google Bridge and Hermes deliver Gmail and Calendar review cards. Inspect the summary or event, open its source, then import or discard. Pending cards stay outside persona processing, memory and search. Discard can exclude a sender, mail type, event or series.</figcaption></figure><figure id="slide-8"><a href="images/08-plans-you-can-manage.png"><img loading="lazy" src="images/08-plans-you-can-manage.png" alt="One schedule view. A reminder you can mark done."></a><figcaption><strong>8. One schedule view. A reminder you can mark done.</strong><br>See tasks across personas in time order, search, edit or cancel them, and control notifications per task. Scheduled reminders can be marked done. Web Push requires device setup and supported browsers; these are kakeratta schedules, separate from Calendar intake.</figcaption></figure><figure id="slide-9"><a href="images/09-room-for-a-new-interest.png"><img loading="lazy" src="images/09-room-for-a-new-interest.png" alt="When a topic grows, one tap makes a new persona."></a><figcaption><strong>9. When a topic grows, one tap makes a new persona.</strong><br>During memory tidying, a subject persona can notice a growing topic or one outside its domain and suggest a new persona at check-in. One tap on Create it adds the persona with its icon, name, routing condition, tone and memory rules drafted for that topic, moves the related facts and records into its memory, and leaves the topic out of the routing condition of the persona that suggested it. This is a curated example of the supported suggestion flow.</figcaption></figure><figure id="slide-10"><a href="images/10-find-and-reflect.png"><img loading="lazy" src="images/10-find-and-reflect.png" alt="Find a fragment, or see the bigger picture."></a><figcaption><strong>10. Find a fragment, or see the bigger picture.</strong><br>Search saved fragments by words or meaning, date and persona. Monthly summaries connect recurring themes and open plans with links back to the original posts.</figcaption></figure><figure id="slide-11"><a href="images/11-teach-the-response.png"><img loading="lazy" src="images/11-teach-the-response.png" alt="See who was called. Teach a better response."></a><figcaption><strong>11. See who was called. Teach a better response.</strong><br>Inspect routing decisions, explain why a persona should respond and review a revised condition. For a reply, preview a revised answer before applying it. These existing UI captures show separate routing and reply-refinement controls.</figcaption></figure><figure id="slide-12"><a href="images/12-bring-your-agents.png"><img loading="lazy" src="images/12-bring-your-agents.png" alt="Choose your AI, in the same personal timeline."></a><figcaption><strong>12. Choose your AI, in the same personal timeline.</strong><br>Ask @ai for built-in answers across posts, persona notes and schedules, with configured Web search and app help from the shipped specification. It does not save notes, change schedules or perform external actions. @agent addresses a configured, enabled external connection such as Hermes or Obsidian LLM Connect Hub; it is hidden from suggestions when disabled. Personas can still prefer an external planner. The captured response is an Obsidian Vault example.</figcaption></figure><figure id="slide-13"><a href="images/13-speak-and-listen.png"><img loading="lazy" src="images/13-speak-and-listen.png" alt="Use your voice to save notes, hear replies and check plans."></a><figcaption><strong>13. Use your voice to save notes, hear replies and check plans.</strong><br>In a supported browser with the English default send phrase, tap Speak to dictate and finish with over. A final trailing over stops recognition, removes the command from the note and automatically posts the remaining text. The send phrase is configurable; the Send button remains available for manual posting. Tap Read aloud on a timeline conversation to hear its post and replies. The English Alexa skill offers three illustrated commands: ask bits notes to take a note, read my replies, or read my schedule. Note-taking asks for the text and reads it back before Yes posts it. Schedule reading covers saved kakeratta schedules. Alexa requires separate configuration and account linking. These examples follow the shipped en-US model; they are not a device recording. Optional AI formatting applies only to configured speech auto-send.</figcaption></figure><figure id="slide-14"><a href="images/14-make-and-share-a-visual.png"><img loading="lazy" src="images/14-make-and-share-a-visual.png" alt="Turn the conversation into a visual, then choose what to share."></a><figcaption><strong>14. Turn the conversation into a visual, then choose what to share.</strong><br>The infographic persona renders Markdown, emoji and Mermaid as visual cards. Choose messages from the same Shizuoka conversation, inspect the preview, then publish to Bluesky. The infographic here is an illustrative travel example rendered with the shipped renderer; it is not a live model response.</figcaption></figure><figure id="slide-15"><a href="images/15-purposeful-models-visible-usage.png"><img loading="lazy" src="images/15-purposeful-models-visible-usage.png" alt="Purposeful model choices. Usage you can inspect."></a><figcaption><strong>15. Purposeful model choices. Usage you can inspect.</strong><br>On the shipped Nebius configuration, Nemotron 3 Super handles routing, ordinary reads, answers, memory notes and daily work; 3.5 Super VL handles ordinary direct @ai questions, deep reads, always-deep answers and schedule planning/review; Ultra composes explicit deep-request final answers. Persona usage exposes monthly cost and search counts. Displayed usage is synthetic sample data, not production billing.</figcaption></figure></html>
