nal timeline posts stay intact.</figcaption></figure><figure><a href="images/05-routing-and-feedback.png"><img src="images/05-routing-and-feedback.png" alt="Understand who responds and refine the behavior"></a><figcaption><strong>Understand who responds and refine the behavior</strong><br>Inspect which personas received a post and why others did not. Adjust routing conditions or preview a revised reply before applying it.</figcaption></figure><figure><a href="images/06-find-the-fragment.png"><img src="images/06-find-the-fragment.png" alt="Find saved fragments by words or meaning"></a><figcaption><strong>Find saved fragments by words or meaning</strong><br>Search your timeline by keyword, meaning, date or persona, and keep useful posts and replies in favorites.</figcaption></figure><figure><a href="images/07-connected-agents.png"><img src="images/07-connected-agents.png" alt="Connect external agents to your personal timeline"></a><figcaption><strong>Connect external agents to your personal timeline</strong><br>Hermes or Obsidian’s LLM Connect Hub can research and answer through MCP. kakeratta keeps the timeline, schedules and memory updates.</figcaption></figure><figure><a href="images/08-powered-by-nemotron.png"><img src="images/08-powered-by-nemotron.png" alt="NVIDIA Nemotron on Nebius Token Factory"></a><figcaption><strong>NVIDIA Nemotron on Nebius Token Factory</strong><br>Nemotron 3.5 Super VL handles routing, everyday reasoning and workflow planning. Ultra composes deep answers. A tagged record is added after publication; facts and summaries are tidied at check-in.</figcaption></figure><figure><a href="images/09-monthly-reflection.png"><img src="images/09-monthly-reflection.png" alt="A month of fragments, connected"></a><figcaption><strong>A month of fragments, connected</strong><br>Monthly summaries bring people, food and unfinished plans together with links back to the original posts.</figcaption></figure><figure><a href="images/10-save-useful-answers.png"><img src="images/10-save-useful-answers.png" alt="Keep useful posts and answers in favorites"></a><figcaption><strong>Keep useful posts and answers in favorites</strong><br>Favorite both your own posts and persona replies, then return to them from the saved-entry view.</figcaption></figure><figure><a href="images/11-offline-fragments.png"><img src="images/11-offline-fragments.png" alt="Capture a thought even while offline"></a><figcaption><strong>Capture a thought even while offline</strong><br>Write while disconnected. Posts stay in this browser’s outbox until the connection returns and delivery can resume.</figcaption></figure><figure><a href="images/12-share-your-selection.png"><img src="images/12-share-your-selection.png" alt="Preview exactly what you share to Bluesky"></a><figcaption><strong>Preview exactly what you share to Bluesky</strong><br>Choose text or image for each selected message, inspect the result inline, and press Post to publish the conversation to Bluesky.</figcaption></figure><figure><a href="images/13-understand-ai-usage.png"><img src="images/13-understand-ai-usage.png" alt="See what each persona costs and what drives it"></a><figcaption><strong>See what each persona costs and what drives it</strong><br>Inspect each persona’s monthly AI costs and web search counts, split into replies, scheduled runs and other work. Compare them with the overall total, including shared processing.</figcaption></figure><figure><a href="images/14-turn-notes-into-infographics.png"><img src="images/14-turn-notes-into-infographics.png" alt="Turn notes and conversations into infographics"></a><figcaption><strong>Turn notes and conversations into infographics</strong><br>Ask the infographic persona to turn existing notes, articles or conversations into visual cards with emoji and Mermaid diagrams. Powered by Nemotron Ultra.</figcaption></figure><figure><a href="images/15-remember-your-people.png"><img src="images/15-remember-your-people.png" alt="Keep the small details
