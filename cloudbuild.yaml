steps:
- id: frontend
  name: node:24-bookworm
  entrypoint: node
  args:
  - frontend/build.mjs
  waitFor:
  - '-'
- id: image
  name: gcr.io/cloud-builders/docker
  args:
  - build
  - --build-arg
  - VERSION=${_VERSION}
  - --tag
  - ${_IMAGE}
  - .
  waitFor:
  - '-'
- id: push
  name: gcr.io/cloud-builders/docker
  args:
  - push
  - ${_IMAGE}
  waitFor:
  - image
- id: frontend-upload
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
  - -ceu
  - 'tar -C frontend/dist -czf /tmp/frontend.tar.gz .

    gcloud storage cp /tmp/frontend.tar.gz gs://geminihub-486523-shared-apps/frontend/${BUILD_ID}.tar.gz'
  waitFor:
  - frontend
- id: deploy-vm
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: gcloud
  args:
  - compute
  - ssh
  - shared-apps
  - --project=geminihub-486523
  - --zone=asia-northeast1-b
  - --tunnel-through-iap
  - --ssh-key-file=/tmp/build-ssh
  - --quiet
  - --command
  - sudo python3 /opt/shared-apps/deploy.py --app kakeratta --image ${_IMAGE} --frontend
    gs://geminihub-486523-shared-apps/frontend/${BUILD_ID}.tar.gz
  waitFor:
  - push
  - frontend-upload
substitutions:
  _IMAGE: asia-northeast1-docker.pkg.dev/kakeratta/kakeratta/kakeratta:${SHORT_SHA}
  _VERSION: ${COMMIT_SHA}
options:
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
