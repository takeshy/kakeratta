version: '3'

# Two pieces. The Go binary is the API; the page is a static site of its own,
# served by Vite while developing and by Firebase Hosting when deployed. Neither
# is built into the other, so `task dev` runs both and `task build` makes only
# the binary.

vars:
  APP_NAME: kakeratta
  BIN_DIR: bin

tasks:
  setup:
    desc: 画面側の開発依存（Vite・Storybook）を入れる
    dir: frontend
    cmds:
      - npm ci

  frontend:
    desc: frontend/dist を作り直す（Firebase Hosting に置くもの。バンドラなし、コピーのみ）
    cmds:
      - node frontend/build.mjs

  build:
    desc: API のビルド（bin/kakeratta）
    cmds:
      - go build -ldflags "-X main.version={{.VERSION | default "dev"}}" -o {{.BIN_DIR}}/{{.APP_NAME}} .

  run:
    desc: API だけ起動（http://127.0.0.1:8787）
    deps: [build]
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}"

  web:
    desc: 画面の開発サーバー（http://127.0.0.1:5173、/api は 8787 へ）
    dir: frontend
    cmds:
      - npm run dev

  dev:
    desc: API と画面を同時に起動
    deps: [run, web]

  stories:
    desc: Storybook（http://127.0.0.1:6106）
    dir: frontend
    cmds:
      - npm run storybook

  captures:
    desc: README のキャプチャを Storybook から撮り直す（docs/captures/）
    dir: frontend
    cmds:
      - npm run captures

  test:
    desc: Go と画面側のテストを走らせる
    cmds:
      - go test ./internal/...
      - node --test tests/*.test.js

  # Linux/amd64 の中身だけで動くので、どこに置いても同じものが動きます。
  release:
    desc: サーバに置く用のバイナリ
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version={{.VERSION | default "dev"}}" -o {{.BIN_DIR}}/{{.APP_NAME}}-linux-amd64 .
