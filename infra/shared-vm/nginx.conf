user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # The existing LB accepts GemiHub's dynamically registered custom domains.
    server {
        listen 8080 default_server;
        server_name gemihub.net *.gemihub.net;
        location / { proxy_pass http://127.0.0.1:8101; proxy_buffering off; }
    }
    server {
        listen 8080;
        server_name kakeratta.net www.kakeratta.net;
        # TLS terminates at the load balancer; do not expose the internal port.
        absolute_redirect off;
        root /opt/shared-apps/frontend;
        # Keep Firebase redirect results on the application's origin so that
        # browsers blocking third-party storage can complete Alexa linking.
        location /__/auth/ {
            proxy_pass https://kakeratta.firebaseapp.com;
            proxy_set_header Host kakeratta.firebaseapp.com;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            access_log off;
        }
        location /api/ { proxy_pass http://127.0.0.1:8102; proxy_buffering off; }
        location = /internal/work { proxy_pass http://127.0.0.1:8103; }
        location = /internal/due { proxy_pass http://127.0.0.1:8102; }
        location = /internal/dispatch { proxy_pass http://127.0.0.1:8102; }
        location = /internal/judge-workspaces { proxy_pass http://127.0.0.1:8102; }
        location /internal/ { return 404; }
        location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
    }
    server {
        listen 8080;
        server_name geo.mcp.takeshy.work;
        location = /mcp {
            proxy_pass http://127.0.0.1:8104;
            proxy_buffering off;
        }
        location / { return 404; }
    }
}
